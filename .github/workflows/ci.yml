name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-fund --no-audit
      - run: npm test
      - name: Seed SQL smoke test
        run: grep -q 'INSERT INTO "trademark_nice"' sql/postgresql/trademark_nice.sql
